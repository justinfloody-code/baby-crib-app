function tasksHTML(){
  const currentWeek = currentWeekNum();
  const cl = activeChecklist();
  if(!cl){
    return `${checklistTabRowHTML()}<div class="card"><div class="empty">No checklists yet.</div></div>${state.showAddChecklist ? newChecklistModalHTML() : ''}`;
  }
  const fs = checklistFilterState(cl.id);
  const allCats = cl.catList && cl.catList.length ? cl.catList : TASK_CATS;
  const catOptions = ["All", ...allCats];
  const timeOptions = ["All","Overdue","This week","Upcoming","No week set"];
  const allAssignees = cl.assigneeList || [];
  const assigneeOptions = ["All", "Unassigned", ...allAssignees];

  let items = cl.tasks.slice();
  if(fs.filterCat !== 'All') items = items.filter(i => i.cat === fs.filterCat);
  if(fs.filterTime === 'Overdue'){
    items = items.filter(i => !i.done && currentWeek != null && i.week != null && i.week < currentWeek);
  } else if(fs.filterTime === 'This week'){
    items = items.filter(i => currentWeek != null && i.week === currentWeek);
  } else if(fs.filterTime === 'Upcoming'){
    items = items.filter(i => currentWeek != null && i.week != null && i.week > currentWeek);
  } else if(fs.filterTime === 'No week set'){
    items = items.filter(i => i.week == null);
  }
  if(fs.hideCompleted) items = items.filter(i => !i.done);
  if(fs.filterAssignee === 'Unassigned') items = items.filter(i => !i.assignee);
  else if(fs.filterAssignee !== 'All') items = items.filter(i => i.assignee === fs.filterAssignee);

  // Sort: unscheduled (no week set) first, then overdue (not done, week < currentWeek) —
  // oldest week first — then remaining scheduled tasks by week ascending.
  items.sort((a,b) => {
    const aNoWeek = a.week == null;
    const bNoWeek = b.week == null;
    if(aNoWeek !== bNoWeek) return aNoWeek ? -1 : 1;
    const aOverdue = !a.done && currentWeek != null && a.week != null && a.week < currentWeek;
    const bOverdue = !b.done && currentWeek != null && b.week != null && b.week < currentWeek;
    if(aOverdue !== bOverdue) return aOverdue ? -1 : 1;
    if(a.week !== b.week) return a.week - b.week;
    return 0;
  });

  function taskEditRow(i){
    return `
    <div class="item-row edit-row">
      <input type="text" class="edit-text" value="${escapeHtml(i.text)}" />
      <input type="number" class="edit-week" value="${i.week != null ? i.week : ''}" placeholder="Week" min="1" max="42" />
      <select class="edit-cat">
        ${allCats.map(c => `<option ${c===i.cat?'selected':''}>${c}</option>`).join('')}
      </select>
      <select class="edit-assignee">
        <option value="" ${!i.assignee?'selected':''}>Unassigned</option>
        ${allAssignees.map(p => `<option ${p===i.assignee?'selected':''}>${p}</option>`).join('')}
      </select>
      <button class="btn small edit-save" data-id="${i.id}" data-kind="task">Save</button>
      <button class="btn ghost small edit-cancel">Cancel</button>
    </div>`;
  }

  let rows = '';
  let lastWeek, opened = false;
  items.forEach(i => {
    const overdue = !i.done && currentWeek != null && i.week != null && i.week < currentWeek;
    if(!opened || i.week !== lastWeek){
      lastWeek = i.week;
      opened = true;
      const label = i.week != null ? `Week ${i.week}` : 'No week set';
      rows += `<div class="week-break"><span>${label}${overdue ? ` <span class="overdue-tag">Overdue</span>` : ''}</span><span class="week-break-line"></span></div>`;
    }
    if(state.editingId === i.id){
      rows += taskEditRow(i);
      return;
    }
    const {bg, text} = catStyle(i.cat, cl.catColors);
    const assigneeStyleVal = i.assignee ? assigneeStyle(i.assignee, cl.assigneeColors) : null;
    rows += `
    <div class="item-row ${i.done?'done':''}">
      <input type="checkbox" data-id="${i.id}" class="chk" ${i.done?'checked':''}/>
      <div class="txt">${escapeHtml(i.text)}</div>
      ${i.assignee ? `<span class="assignee-pill" style="background:${assigneeStyleVal.bg};color:${assigneeStyleVal.text};">${escapeHtml(i.assignee)}</span>` : ''}
      <span class="cat-pill" style="background:${bg};color:${text};">${i.cat}</span>
      <div class="row-menu">
        <button class="row-menu-btn" data-id="${i.id}">▾</button>
        ${state.openMenuId === i.id ? `
        <div class="row-menu-dropdown">
          <button class="menu-edit" data-id="${i.id}" data-kind="task">Edit</button>
          <button class="menu-delete" data-id="${i.id}" data-kind="task">Delete</button>
        </div>` : ''}
      </div>
    </div>`;
  });
  if(items.length === 0) rows = `<div class="empty">No checklist items match this filter.</div>`;

  return `
  ${checklistTabRowHTML()}
  <div class="card">
    <div class="card-header-row">
      <h2 style="margin-bottom:0;">${escapeHtml(cl.name)}</h2>
      <button type="button" class="settings-icon-btn" id="cat-settings-btn" title="Manage categories">${legoIconSVG()}</button>
    </div>
    <button type="button" class="mobile-controls-toggle" id="checklist-controls-toggle">
      <span>${state.checklistControlsOpen ? 'Hide add & filter' : 'Add task / filter'}</span>
      <span class="mobile-controls-toggle-caret">${state.checklistControlsOpen ? '▲' : '▼'}</span>
    </button>
    <div class="mobile-controls ${state.checklistControlsOpen ? 'open' : ''}">
      <div class="add-row" style="margin-top:14px;">
        <input type="text" id="new-task" placeholder="Add a to-do…" />
        <input type="number" id="new-task-week" class="week-input" placeholder="Week" min="1" max="42" />
        <select id="new-task-cat">
          ${allCats.map(c => `<option>${c}</option>`).join('')}
        </select>
        <select id="new-task-assignee">
          <option value="">Assign to… (optional)</option>
          ${allAssignees.map(p => `<option>${p}</option>`).join('')}
        </select>
        <button class="btn small" id="add-task">Add</button>
      </div>
      <div class="filter-row">
        <select id="task-filter-cat">
          ${catOptions.map(c => `<option value="${c}" ${fs.filterCat===c?'selected':''}>${c==='All'?'All categories':c}</option>`).join('')}
        </select>
        <select id="task-filter-time">
          ${timeOptions.map(t => `<option value="${t}" ${fs.filterTime===t?'selected':''}>${t==='All'?'All timeframes':t}</option>`).join('')}
        </select>
        <select id="task-filter-assignee">
          ${assigneeOptions.map(p => `<option value="${p}" ${fs.filterAssignee===p?'selected':''}>${p==='All'?'All assignees':p}</option>`).join('')}
        </select>
        <label class="hide-completed-toggle">
          <input type="checkbox" id="task-hide-completed" ${fs.hideCompleted ? 'checked' : ''}/>
          Hide completed
        </label>
      </div>
    </div>
    ${rows}
  </div>
  ${state.showCatSettings ? catSettingsModalHTML([
    { list: allCats, scope: 'task', singular: 'category', placeholder: 'New category…', addLabel: 'Add category', pluralLower: 'categories', colorMap: cl.catColors },
    { list: allAssignees, scope: 'assignee', singular: 'person', placeholder: 'Person’s name…', addLabel: 'Add person', pluralLower: 'people', colorMap: cl.assigneeColors },
  ], `Manage “${cl.name}” options`, { id: cl.id, name: cl.name, canDelete: state.checklists.length > 1 }) : ''}
  ${state.showAddChecklist ? newChecklistModalHTML() : ''}`;

function knownUsersFor(gender){
  const set = new Set();
  if(state.name) set.add(state.name);
  (state.names || []).filter(n => n.gender === gender).forEach(n => { if(n.addedBy) set.add(n.addedBy); });
  const rk = state.rankings[gender] || {};
  Object.keys(rk).forEach(u => set.add(u));
  return Array.from(set);
}

function orderFor(gender, user){
  const namesInGender = state.names.filter(n => n.gender === gender).map(n => n.id);
  const saved = (state.rankings[gender] && state.rankings[gender][user]) || [];
  const savedValid = saved.filter(id => namesInGender.includes(id));
  const missing = namesInGender.filter(id => !savedValid.includes(id));
  return [...savedValid, ...missing];
}

function nameById(id){ return state.names.find(n => n.id === id); }

function namesHTML(){
  const gender = state.namesGender;
  const user = state.name;
  const order = orderFor(gender, user);
  const users = knownUsersFor(gender);

  let myList;
  if(order.length === 0){
    myList = `<div class="empty">No ${gender.toLowerCase()} names yet — add your first idea below.</div>`;
  } else {
    myList = order.map((id, idx) => {
      const n = nameById(id);
      if(!n) return '';
      if(state.editingId === id){
        return `
        <div class="name-card editing">
          <input type="text" class="edit-name-text" value="${escapeHtml(n.name)}" />
          <button class="btn small edit-name-save" data-id="${id}">Save</button>
          <button class="btn ghost small edit-name-cancel">Cancel</button>
        </div>`;
      }
      return `
      <div class="name-card">
        <div class="rank-controls">
          <button class="rank-up" data-id="${id}" ${idx===0?'disabled':''}>▲</button>
          <span class="rank-num">${idx+1}</span>
          <button class="rank-down" data-id="${id}" ${idx===order.length-1?'disabled':''}>▼</button>
        </div>
        <div class="name-left">
          <div class="nm">${escapeHtml(n.name)}</div>
          <div class="meta">added by ${escapeHtml(n.addedBy)}</div>
        </div>
        <div class="row-menu">
          <button class="row-menu-btn" data-id="${id}">▾</button>
          ${state.openMenuId === id ? `
          <div class="row-menu-dropdown">
            <button class="menu-edit" data-id="${id}" data-kind="name">Edit</button>
            <button class="menu-delete" data-id="${id}" data-kind="name">Delete</button>
          </div>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  // Exactly two favorites panels — you (always left) and your partner (always right) — instead
  // of one column per every known contributor. Partner is whichever parent name isn't yours;
  // fall back to any other contributor if the parent names haven't been set up yet.
  const partner = [state.info.motherName, state.info.fatherName].find(n => n && n.trim() && n !== user)
    || users.find(u => u !== user)
    || null;

  function favoritesPanelHTML(person){
    if(!person){
      return `<div class="card fav-panel"><h3>Partner's favorites</h3><div class="empty">Your partner hasn't set up their name yet.</div></div>`;
    }
    const pOrder = orderFor(gender, person).slice(0, 10);
    const items = pOrder.map(id => {
      const n = nameById(id);
      return n ? `<li>${escapeHtml(n.name)}</li>` : '';
    }).join('');
    return `
    <div class="card fav-panel">
      <h3>${escapeHtml(person)}'s favorites</h3>
      ${pOrder.length ? `<ol>${items}</ol>` : `<div class="empty">No ranked names yet.</div>`}
    </div>`;
  }

  return `
  <div class="gender-tab-row">
    ${NAME_GENDERS.map(g => `<button data-gender="${g}" class="gender-tab ${g.toLowerCase()} ${gender===g?'active':''}">${g}</button>`).join('')}
  </div>
  <div class="fav-panels-row">
    ${favoritesPanelHTML(user)}
    ${nameOfDayHTML()}
    ${favoritesPanelHTML(partner)}

  <div class="card">
    <h2 style="margin-bottom:14px;">Rank your favorites</h2>

      <button class="btn small" id="n-add">Add</button>
    </div>
    <div style="font-size:13px;color:var(--sage);margin-bottom:10px;">Use ▲ ▼ to rank in order of preference — #1 is your favorite.</div>
    ${myList}
  </div>`;
}

// ---- Journal Entries tab ----
// Real WYSIWYG formatting via a contenteditable box + document.execCommand, so Bold/Italic/
// Underline/Bullet apply directly to the current selection (or toggle on for what's typed next),
// same as a normal rich-text toolbar. Saved HTML is whitelist-sanitized before it's stored/synced.

function formatToolbarHTML(){
  return `
  <div class="format-toolbar">
    <button type="button" class="fmt-btn" data-fmt="bold" title="Bold"><strong>B</strong></button>
    <button type="button" class="fmt-btn" data-fmt="italic" title="Italic"><em>I</em></button>
    <button type="button" class="fmt-btn" data-fmt="underline" title="Underline"><u>U</u></button>
    <button type="button" class="fmt-btn" data-fmt="bullet" title="Bulleted list">☰</button>
  </div>`;
}

const JOURNAL_FMT_COMMANDS = { bold: 'bold', italic: 'italic', underline: 'underline', bullet: 'insertUnorderedList' };

// Lights up each toolbar button (bold/italic/underline/bullet) when the current cursor
// position or selection already has that formatting, like a normal rich-text editor.
function updateJournalFmtButtons(){
  document.querySelectorAll('.journal-rich-input').forEach(box => {
    const wrap = box.closest('.journal-editor');
    if(!wrap) return;
    const focused = document.activeElement === box;
    wrap.querySelectorAll('.fmt-btn').forEach(btn => {
      let isActive = false;
      if(focused){
        try{ isActive = document.queryCommandState(JOURNAL_FMT_COMMANDS[btn.dataset.fmt]); }catch(e){ isActive = false; }
      }
      btn.classList.toggle('active', isActive);
    });
  });
}
document.onselectionchange = updateJournalFmtButtons;

const JOURNAL_ALLOWED_TAGS = new Set(['B','STRONG','I','EM','U','UL','OL','LI','BR','DIV']);
function sanitizeJournalHTML(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  (function clean(node){
    [...node.childNodes].forEach(child => {
      if(child.nodeType === 3) return;
      if(child.nodeType !== 1){ child.remove(); return; }
      if(!JOURNAL_ALLOWED_TAGS.has(child.tagName)){
        while(child.firstChild) node.insertBefore(child.firstChild, child);
        node.removeChild(child);
        return;
      }
      [...child.attributes].forEach(attr => child.removeAttribute(attr.name));
      clean(child);
    });
  })(tmp);
  return tmp.innerHTML;
}

// Legacy fallback for entries saved before the rich-text editor (plain text with
// **bold**/*italic*/__underline__/"- " bullet markup) — new entries are stored as real HTML.
function formatJournalText(raw){
  const lines = (raw || '').split('\n');
  let html = '';
  let inList = false;
  lines.forEach(line => {
    const isBullet = /^- /.test(line);
    if(isBullet && !inList){ html += '<ul>'; inList = true; }
    if(!isBullet && inList){ html += '</ul>'; inList = false; }
    let content = escapeHtml(isBullet ? line.slice(2) : line);
    content = content.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    content = content.replace(/__(.+?)__/g, '<u>$1</u>');
    content = content.replace(/\*(.+?)\*/g, '<em>$1</em>');
    html += isBullet ? `<li>${content}</li>` : content + '<br>';
  });
  if(inList) html += '</ul>';
  return html;
}

function renderJournalText(raw){
  return /<[a-z][\s\S]*>/i.test(raw || '') ? raw : formatJournalText(raw);
}

function journalEntryRow(e){
  const isEditing = state.editingId === e.id;
  // Shared entries are editable/deletable by either partner; private entries stay author-only

function bindTabEvents(){
  // Overview / Settings — due date
  const dueSave = document.getElementById('due-save');
  if(dueSave){

      if(!text) return;

      state.journal.push({ id: uid(), text, authorName: state.name, createdAt: new Date().toISOString(), visibility });
      await saveHousehold('journal');
      render();
    };
  }

  // Home — notes quick entry (mirrors the journal quick entry above, but files into whichever
  // section the user picks, same as the full Notes tab composer).
  const homeNotesSave = document.getElementById('home-notes-save');
  if(homeNotesSave){
    homeNotesSave.onclick = async () => {
      const text = document.getElementById('home-notes-text').value.trim();
      if(!text) return;

      state.activeNoteThemeId = theme.id;
      personalSet('active-note-theme-id', theme.id);
      await saveHousehold('noteThemes');
      render();
    };

  // Journal Entries tab — new entry + edit/delete
  const journalNewSave = document.getElementById('journal-new-save');
  if(journalNewSave){
    journalNewSave.onclick = async () => {
      const box = document.getElementById('journal-new-text');
      const text = sanitizeJournalHTML(box.innerHTML);

      e.preventDefault();
      const wrap = btn.closest('.journal-editor');
      const box = wrap ? wrap.querySelector('.journal-rich-input') : null;
      if(!box) return;
      box.focus();
      document.execCommand(JOURNAL_FMT_COMMANDS[btn.dataset.fmt], false, null);
      updateJournalFmtButtons();

  root.querySelectorAll('.journal-rich-input').forEach(box => {
    // Selection can move by click/keyboard within the box without a selectionchange
    // firing in every browser, so keep the toolbar state in sync on these too.
    box.addEventListener('keyup', updateJournalFmtButtons);
    box.addEventListener('mouseup', updateJournalFmtButtons);
    box.addEventListener('focus', updateJournalFmtButtons);
    box.addEventListener('blur', updateJournalFmtButtons);
  });
  root.querySelectorAll('.journal-menu-edit').forEach(btn => {
    btn.onclick = () => { state.editingId = btn.dataset.id; state.openMenuId = null; render(); };

  root.querySelectorAll('.journal-menu-delete').forEach(btn => {

  root.querySelectorAll('.journal-edit-save').forEach(btn => {

  // Notes tab — new entry + edit/delete, scoped to the active theme (saving to state.noteThemes).

  // since that logic is generic.
  const notesNewSave = document.getElementById('notes-new-save');
  if(notesNewSave){
    notesNewSave.onclick = async () => {
      const box = document.getElementById('notes-new-text');
      const text = sanitizeJournalHTML(box.innerHTML);
      if(!box.textContent.trim()) return;
      const visibility = document.getElementById('notes-new-visibility').value;
      const themeId = document.getElementById('notes-new-theme').value;
      const theme = state.noteThemes.find(t => t.id === themeId);
      if(!theme) return;
      theme.notes.push({ id: uid(), text, authorName: state.name, createdAt: new Date().toISOString(), visibility });
      // Jump the view to whichever theme the note was filed under, so it's immediately visible
      // even if that's a different theme than the one currently on screen.
      state.activeNoteThemeId = theme.id;
      personalSet('active-note-theme-id', theme.id);
      await saveHousehold('noteThemes');
      render();
    };

  const notesFilterVis = document.getElementById('notes-filter-visibility');
  if(notesFilterVis){
    notesFilterVis.onchange = () => {
      const theme = activeNoteTheme();
      if(!theme) return;

      render();
    };
  }
  root.querySelectorAll('.notes-menu-edit').forEach(btn => {
    btn.onclick = () => { state.editingId = btn.dataset.id; state.openMenuId = null; render(); };
  });
  root.querySelectorAll('.notes-menu-delete').forEach(btn => {
    btn.onclick = async () => {
      const theme = activeNoteTheme();
      if(!theme) return;
      theme.notes = theme.notes.filter(e => e.id !== btn.dataset.id);
      state.openMenuId = null;
      await saveHousehold('noteThemes');
      render();
    };
  });
  root.querySelectorAll('.notes-edit-cancel').forEach(btn => {
    btn.onclick = () => { state.editingId = null; render(); };
  });
  root.querySelectorAll('.notes-edit-save').forEach(btn => {
    btn.onclick = async () => {
      const theme = activeNoteTheme();
      if(!theme) return;
      const id = btn.dataset.id;
      const wrap = btn.closest('.journal-entry');
      const box = wrap.querySelector('.notes-edit-text');
      const text = sanitizeJournalHTML(box.innerHTML);
      if(!box.textContent.trim()) return;
      const visibility = wrap.querySelector('.notes-edit-visibility').value;
      const entry = theme.notes.find(e => e.id === id);
      entry.text = text;
      entry.visibility = visibility;
      state.editingId = null;
      await saveHousehold('noteThemes');
      render();
    };
  });

  // Note theme switcher + drag-to-reorder — identical pattern to the Checklist tab row above,
  // duplicated under note-theme-* class names so the two tabs' handlers can't cross-bind.
  const NOTE_THEME_DRAG_THRESHOLD = 6;
  root.querySelectorAll('.note-theme-tab-wrap').forEach(wrap => {
    const btn = wrap.querySelector('.note-theme-tab');
    if(!btn) return;
    let startX = 0;
    let dragging = false;
    let pressed = false;

    btn.onpointerdown = (e) => {
      pressed = true;
      startX = e.clientX;
      dragging = false;
      try{ btn.setPointerCapture(e.pointerId); }catch(err){}
    };
    btn.onpointermove = (e) => {
      if(!pressed) return;
      const dx = e.clientX - startX;
      if(!dragging && Math.abs(dx) > NOTE_THEME_DRAG_THRESHOLD){
        dragging = true;
        wrap.classList.add('dragging');
      }
      if(dragging) wrap.style.transform = `translateX(${dx}px)`;
    };
    const endDrag = async (e) => {
      pressed = false;
      try{ btn.releasePointerCapture(e.pointerId); }catch(err){}
      if(!dragging) return;
      btn._justDragged = true;

      const row = wrap.parentElement;
      const siblings = [...row.querySelectorAll('.note-theme-tab-wrap')].filter(s => s !== wrap);
      const wrapRect = wrap.getBoundingClientRect();
      const wrapCenter = wrapRect.left + wrapRect.width / 2;
      let placed = false;
      for(const sib of siblings){
        const rect = sib.getBoundingClientRect();
        const mid = rect.left + rect.width / 2;
        if(wrapCenter < mid){ row.insertBefore(wrap, sib); placed = true; break; }
      }
      if(!placed && siblings.length) siblings[siblings.length - 1].after(wrap);

      wrap.classList.remove('dragging');
      wrap.style.transform = '';
      dragging = false;

      const row2 = wrap.parentElement;
      const orderedIds = [...row2.querySelectorAll('.note-theme-tab-wrap')].map(w => w.dataset.id);
      state.noteThemes.sort((a,b) => orderedIds.indexOf(a.id) - orderedIds.indexOf(b.id));
      await saveHousehold('noteThemes');
      render();
    };
    btn.onpointerup = endDrag;
    btn.onpointercancel = () => {
      pressed = false;
      dragging = false;
      wrap.classList.remove('dragging');
      wrap.style.transform = '';
    };
  });
  root.querySelectorAll('.note-theme-tab').forEach(btn => {
    btn.onclick = () => {
      if(btn._justDragged){ btn._justDragged = false; return; }
      state.activeNoteThemeId = btn.dataset.id;
      personalSet('active-note-theme-id', state.activeNoteThemeId);
      state.openMenuId = null;
      state.editingId = null;
      state.showNoteThemeSettings = false;
      render();

    newNoteThemeModalClose.onclick = () => { state.showAddNoteTheme = false; render(); };

  const newNoteThemeModalOverlay = document.getElementById('new-note-theme-modal-overlay');
  if(newNoteThemeModalOverlay){

  }
  const newNoteThemeCreateBtn = document.getElementById('new-note-theme-create');
  if(newNoteThemeCreateBtn){
    newNoteThemeCreateBtn.onclick = async () => {

      render();
    };
  }
  const noteThemeSettingsBtn = document.getElementById('note-theme-settings-btn');
  if(noteThemeSettingsBtn){
    noteThemeSettingsBtn.onclick = () => { state.showNoteThemeSettings = true; render(); };
  }
  const noteThemeModalClose = document.getElementById('note-theme-modal-close');
  if(noteThemeModalClose){
    noteThemeModalClose.onclick = () => { state.showNoteThemeSettings = false; render(); };
  }
  const noteThemeModalOverlay = document.getElementById('note-theme-modal-overlay');
  if(noteThemeModalOverlay){
    noteThemeModalOverlay.onclick = (e) => { if(e.target === noteThemeModalOverlay){ state.showNoteThemeSettings = false; render(); } };
  }
  const noteThemeModalRenameBtn = document.getElementById('note-theme-modal-rename-btn');
  if(noteThemeModalRenameBtn){
    noteThemeModalRenameBtn.onclick = async () => {
      const target = state.noteThemes.find(t => t.id === noteThemeModalRenameBtn.dataset.id);
      const input = document.getElementById('note-theme-modal-name-input');
      if(!target || !input) return;
      const newName = input.value.trim();
      if(!newName || newName === target.name) return;
      target.name = newName;
      await saveHousehold('noteThemes');
      render();
    };
  }
  root.querySelectorAll('.note-theme-modal-delete-btn').forEach(btn => {
    btn.onclick = async () => {
      if(state.noteThemes.length <= 1) return; // always keep at least one theme
      const target = state.noteThemes.find(t => t.id === btn.dataset.id);
      if(!target) return;
      if(!confirm(`Delete the "${target.name}" section? This will permanently remove all ${target.notes.length} note${target.notes.length===1?'':'s'} in it.`)) return;

  // past a small threshold first, it's treated as a drag instead — the tab visually slides
  // left/right with the pointer via a CSS transform (pointer capture keeps move/up events
  // flowing to the button even once the finger moves off it), and the resulting click that the
  // browser fires right after pointerup is swallowed so a drag never also triggers a switch.

    const btn = wrap.querySelector('.checklist-tab');

    let startX = 0;
    let dragging = false;
    let pressed = false; // guards pointermove so hovering (no button/finger down) does nothing —
                          // pointermove fires on plain mouse hover too, not just while dragging

    btn.onpointerdown = (e) => {
      pressed = true;
      startX = e.clientX;
      dragging = false;
      try{ btn.setPointerCapture(e.pointerId); }catch(err){}
    };
    btn.onpointermove = (e) => {
      if(!pressed) return;
      const dx = e.clientX - startX;
      if(!dragging && Math.abs(dx) > CHECKLIST_DRAG_THRESHOLD){
        dragging = true;
        wrap.classList.add('dragging');
      }
      if(dragging) wrap.style.transform = `translateX(${dx}px)`;
    };
    const endDrag = async (e) => {
      pressed = false;
      try{ btn.releasePointerCapture(e.pointerId); }catch(err){}
      if(!dragging) return; // plain tap — let the click handler below switch checklists
      btn._justDragged = true;

      const row = wrap.parentElement;

      // on-screen center after being dragged — find the first sibling whose midpoint it has
      // passed and drop it there; if it was dragged past everyone, it goes at the end.
      const wrapRect = wrap.getBoundingClientRect();
      const wrapCenter = wrapRect.left + wrapRect.width / 2;

        const rect = sib.getBoundingClientRect();
        const mid = rect.left + rect.width / 2;
        if(wrapCenter < mid){
          row.insertBefore(wrap, sib);
          placed = true;
          break;
        }
      }
      if(!placed && siblings.length) siblings[siblings.length - 1].after(wrap);

      wrap.classList.remove('dragging');
      wrap.style.transform = '';
      dragging = false;

      state.checklists.sort((a,b) => orderedIds.indexOf(a.id) - orderedIds.indexOf(b.id));
      await saveHousehold('checklists');
      render();
    };

        });
        await saveHouseholdFields({ names: state.names, rankings: state.rankings });
      }
      state.openMenuId = null;
      render();
    };
  });
  root.querySelectorAll('.edit-cancel').forEach(btn => {
    btn.onclick = () => { state.editingId = null; render(); };
  });
  root.querySelectorAll('.edit-save').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      const kind = btn.dataset.kind;
      const row = btn.closest('.item-row');
      const text = row.querySelector('.edit-text').value.trim();
      if(!text) return;
      const cat = row.querySelector('.edit-cat').value;
      if(kind === 'task'){
        if(!cl) return;
        const item = cl.tasks.find(i=>i.id===id);
        const weekInp = row.querySelector('.edit-week');
        const assigneeSel = row.querySelector('.edit-assignee');
        item.text = text;
        item.cat = cat;
        item.week = weekInp && weekInp.value ? Number(weekInp.value) : null;
        item.assignee = assigneeSel && assigneeSel.value ? assigneeSel.value : null;
        state.editingId = null;
        await saveHousehold('checklists');
      } else {
        const item = state.registry.find(i=>i.id===id);
        const sourceSel = row.querySelector('.edit-source');
        const notesInp = row.querySelector('.edit-notes');
        item.text = text;
        item.cat = cat;
        item.notes = notesInp && notesInp.value.trim() ? notesInp.value.trim() : null;
        item.source = sourceSel && sourceSel.value ? sourceSel.value : null;
        state.editingId = null;
        await saveHousehold('registry');
      }
      render();
    };
  });

  // Names
  root.querySelectorAll('.gender-tab-row button').forEach(btn => {
    btn.onclick = () => { state.namesGender = btn.dataset.gender; render(); };
  });
  const nAdd = document.getElementById('n-add');
  if(nAdd){
    nAdd.onclick = async () => {
      const name = document.getElementById('n-name').value.trim();
      if(!name) return;
      const gender = state.namesGender;
      const id = uid();
      state.names.push({id, name, gender, addedBy: state.name});
      // Append to the current user's ranking at the end.
      if(!state.rankings[gender]) state.rankings[gender] = {};
      const order = orderFor(gender, state.name).filter(x => x !== id);
      order.push(id);
      state.rankings[gender][state.name] = order;
      await saveHouseholdFields({ names: state.names, rankings: state.rankings });
      render();
    };
  }
  root.querySelectorAll('.edit-name-cancel').forEach(btn => {
    btn.onclick = () => { state.editingId = null; render(); };
  });
  root.querySelectorAll('.edit-name-save').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      const wrap = btn.closest('.name-card');
      const text = wrap.querySelector('.edit-name-text').value.trim();
      if(!text) return;
      const n = nameById(id);
      if(n) n.name = text;
      state.editingId = null;
      await saveHousehold('names');
      render();
    };
  });
  root.querySelectorAll('.rank-up, .rank-down').forEach(btn => {
    btn.onclick = async () => {
      const gender = state.namesGender;
      const user = state.name;
      const order = orderFor(gender, user);
      const id = btn.dataset.id;
      const idx = order.indexOf(id);
      const dir = btn.classList.contains('rank-up') ? -1 : 1;
      const swapIdx = idx + dir;
      if(swapIdx < 0 || swapIdx >= order.length) return;
      [order[idx], order[swapIdx]] = [order[swapIdx], order[idx]];
      if(!state.rankings[gender]) state.rankings[gender] = {};
      state.rankings[gender][user] = order;
      await saveHousehold('rankings');
      render();
    };
  });
}

// Re-checks the hero lemon/text overlap on viewport resize (e.g. rotating a phone, resizing a
// browser window) — cheap, and added once here rather than inside renderApp() so it doesn't
// stack a duplicate listener on every re-render.
window.addEventListener('resize', () => { if(state.tab === 'overview') avoidLemonTextOverlap(); });

(async function init(){
  render();
  await loadPersonal();
  if(state.name && state.code){
    await loadHousehold();
  }
  state.loading = false;
  render();
})();
</script>
</body>
</html>
