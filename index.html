<style>

    --terracotta: #b57b66;

    font-family: 'Public Sans', sans-serif;

    font-family:'JetBrains Mono', monospace;

    color: var(--terracotta); font-weight: 700; margin-bottom:4px; display:block;

  .brand-icon{ color: var(--terracotta); display:inline-flex; vertical-align:-7px; margin-right:6px; }

  /* ---------- Setup screen ---------- */
  .setup-wrap{ min-height: 80vh; display:flex; align-items:center; justify-content:center; }
  .setup-card{
    background: #fff; border:1px solid var(--blush); border-radius: var(--radius);

    text-align:center;
  }
  .setup-card h1{font-size: 30px; margin-bottom:6px; text-align:left;}
  .setup-card .eyebrow{ text-align:left; }
  .setup-card p.sub{color: var(--evergreen); opacity:.8; font-size:14.5px; line-height:1.5; margin: 8px 0 22px; text-align:left;}
  .setup-card label, .setup-card input, .setup-card .btn, .setup-card .err{ text-align:left; }
  label{ font-size:12.5px; font-weight:700; color: var(--evergreen); display:block; margin: 14px 0 6px; }
  input[type=text], input[type=date], input[type=number], select, textarea{
    width:100%; font-family:'Public Sans',sans-serif; font-size:15px;
    padding: 10px 12px; border-radius: 9px; border: 1.5px solid var(--blush);
    background: #fff; color: var(--evergreen);

  input:focus, select:focus, textarea:focus{ outline:none; border-color: var(--terracotta); }
  .btn{
    font-family:'Public Sans',sans-serif; font-weight:700; font-size:14.5px;
    border:none; border-radius: 9px; padding: 11px 18px; cursor:pointer;
    background: var(--terracotta); color: #fff; transition: transform .12s ease, filter .15s ease;
  }
  .btn:hover{ filter: brightness(0.92); }
  .btn:active{ transform: scale(0.97); }
  .btn.block{ width:100%; margin-top: 20px; }
  .btn.ghost{ background: transparent; color: var(--terracotta); border:1.5px solid var(--terracotta); }
  .btn.small{ padding: 6px 12px; font-size: 13px; }
  .err{ color: var(--terracotta); font-size: 13px; margin-top: 10px; }

  /* ---------- Header / nav ---------- */
  .topbar{ display:flex; align-items:flex-start; justify-content:space-between; padding: 6px 2px 14px; gap:12px; }
  .topbar h1{ font-size: 22px; display:flex; align-items:center; }
  .who-col{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .who{ font-family:'JetBrains Mono',monospace; font-size:12px; color: var(--sage); text-align:right; }
  .who button{ background:none; border:none; color:var(--terracotta); font-family:inherit; cursor:pointer; text-decoration:underline; font-size:12px; padding:0; margin-left:6px;}

  nav.tabs button{
    font-family:'Public Sans',sans-serif; font-weight:700; font-size:13.5px;

  /* ---------- Names ---------- */

  .subtab-row button{
    font-family:'Public Sans',sans-serif; font-weight:700; font-size:12.5px;
    background: var(--blush); color: var(--evergreen); border:none; border-radius:8px;
    padding: 7px 14px; cursor:pointer;
  }

  .name-card{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--blush); gap:10px; flex-wrap:wrap;}
  .name-card:last-child{ border-bottom:none; }
  .name-left{ display:flex; flex-direction:column; }
  .name-left .nm{ font-family:'Fraunces',serif; font-size:18px; color: var(--evergreen); }
  .name-left .meta{ font-size:11px; color: var(--sage); font-family:'JetBrains Mono',monospace; }
  .rank-controls{ display:flex; align-items:center; gap:6px; }
  .rank-controls .rank-num{ font-family:'JetBrains Mono',monospace; font-size:12px; color: var(--evergreen); font-weight:700; min-width:22px; text-align:center; }
  .rank-controls button{
    background:none; border:1px solid var(--blush); border-radius:6px; width:24px; height:22px;
    font-size:12px; cursor:pointer; color: var(--evergreen); line-height:1; padding:0;
  }
  .rank-controls button:disabled{ opacity:.3; cursor:default; }
  .unranked-pill{ font-family:'JetBrains Mono',monospace; font-size:10px; color: var(--sage); }

  .top10-grid{ display:grid; grid-template-columns: 1fr; gap:14px; margin-top:8px; }
  @media(min-width:520px){ .top10-grid{ grid-template-columns: 1fr 1fr; } }
  .top10-col{ background: var(--blush); border-radius:10px; padding:14px 16px; }
  .top10-col h4{ font-family:'Fraunces',serif; font-size:14px; color: var(--evergreen); margin:0 0 8px; }
  .top10-col ol{ margin:0; padding-left:20px; font-size:13.5px; line-height:1.7; color: var(--evergreen); }

  .empty{ color: var(--sage); font-size:13.5px; text-align:center; padding: 20px 0; }
  ::placeholder{ color: var(--sage); opacity:.8; }
</style>
</head>

// ---------- Registry / equipment checklist ----------
// Adapted from a standard baby essentials registry checklist.
const REGISTRY_CATS = ["Wardrobe","Nursery","Diapering","Bath","Feeding","Health","Gear","Playtime"];
const DEFAULT_REGISTRY = [
  // Wardrobe
  {t:"Onesies/bodysuits — plan for about 4-8", cat:"Wardrobe"},

  {t:"Rectal thermometer (most accurate reading for a newborn)", cat:"Health"},

  {t:"Infant or convertible car seat", cat:"Gear"},

const NAME_GENDERS = ["Girl","Boy","Neutral"];

function uid(){ return Math.random().toString(36).slice(2,10); }

function weeksFromDueDate(dueDateStr){
  const due = new Date(dueDateStr + "T00:00:00");
  const now = new Date();
  const msPerWeek = 7*24*60*60*1000;
  const totalDays = 280; // 40 weeks
  const conception = new Date(due.getTime() - totalDays*24*60*60*1000);
  const elapsedMs = now - conception;
  let week = Math.floor(elapsedMs / msPerWeek);
  if(week < 4) week = 4;
  if(week > 40) week = 40;
  const daysLeft = Math.max(0, Math.round((due - now) / (24*60*60*1000)));
  return {week, daysLeft, due};
}

function trimesterOf(week){
  if(week <= 13) return 1;
  if(week <= 27) return 2;
  return 3;
}

// ---------- Personal login (this device only) ----------
function personalGet(key){
  try{ const raw = localStorage.getItem('crib:'+key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function personalSet(key, value){
  try{ localStorage.setItem('crib:'+key, JSON.stringify(value)); }catch(e){}
}

// ---------- Shared household data (synced live via Firebase) ----------
function householdRef(field){ return fbDb.ref(`households/${state.code}/${field}`); }

async function fbFetch(field){
  if(!fbDb) return { exists:false, value:null, ok:false };
  try{
    const snap = await householdRef(field).once('value');
    return { exists: snap.exists(), value: snap.exists() ? snap.val() : null, ok:true };
  }catch(e){
    console.error('Firebase read failed for', field, e);
    return { exists:false, value:null, ok:false };
  }
}

function legacyLocal(field){
  try{
    const raw = localStorage.getItem(`crib:household:${state.code}:${field}`);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

async function saveHousehold(field){
  const value = state[field];
  try{ localStorage.setItem(`crib:household:${state.code}:${field}`, JSON.stringify(value)); }catch(e){}
  if(fbDb){
    try{ await householdRef(field).set(value === undefined ? null : value); }
    catch(e){ console.error('Firebase write failed for', field, e); }
  }
}

function safeRerenderFromRemote(){
  const contentEl = document.getElementById('tab-content');
  const active = document.activeElement;
  const typing = active && contentEl && contentEl.contains(active) && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
  if(typing) return;
  render();
}

function attachLiveSync(){
  if(!fbDb || !state.code || state.liveAttached) return;
  state.liveAttached = true;
  fbDb.ref(`households/${state.code}`).on('value', (snap) => {
    if(state.loading) return; // initial load paints itself once ready
    const val = snap.val() || {};
    if(val.info) state.info = val.info;
    if(state.info.motherName === undefined) state.info.motherName = '';
    if(state.info.fatherName === undefined) state.info.fatherName = '';
    if(val.tasks) state.tasks = val.tasks;
    if(val.registry) state.registry = val.registry;
    if(val.names) state.names = val.names;
    if(val.rankings) state.rankings = val.rankings;
    safeRerenderFromRemote();
  });
}

const root = document.getElementById('root');
let state = {
  code: null,
  name: null,
  info: { dueDate: null, motherName: '', fatherName: '' },
  tasks: [],
  registry: [],
  names: [],
  rankings: {},   // { Girl: { [userName]: [nameId,...] }, Boy: {...}, Neutral: {...} }
  tab: 'overview',
  namesGender: 'Girl',
  taskFilterCat: 'All',
  taskFilterTime: 'All',
  registryFilterCat: 'All',
  loading: true,
  liveAttached: false,
};

function currentWeekNum(){
  if(!state.info.dueDate) return null;
  return weeksFromDueDate(state.info.dueDate).week;
}

async function loadPersonal(){
  state.name = personalGet('display-name');
  state.code = personalGet('household-code');
}

async function loadHousehold(){
  if(!state.code) return;

  const fields = ['info','tasks','registry','names','rankings'];
  const results = {};
  for(const f of fields){
    let r = await fbFetch(f);
    if(!r.exists && r.ok){
      // Nothing in Firebase yet for this field — migrate an existing local copy up
      // (this covers people who used the app before live sync existed).
      const legacy = legacyLocal(f);
      if(legacy != null){
        r = { exists:true, value: legacy, ok:true };
        try{ await householdRef(f).set(legacy); }catch(e){ console.error(e); }
      }
    }
    results[f] = r.value;
  }

  // Even older installs stored tasks+registry combined under a single "checklist" key.
  let oldChecklist = null;
  if(results.tasks == null && results.registry == null){
    oldChecklist = legacyLocal('checklist');
  }

  state.info = results.info || { dueDate: null };
  if(state.info.motherName === undefined) state.info.motherName = '';
  if(state.info.fatherName === undefined) state.info.fatherName = '';
  state.names = results.names || [];
  state.rankings = results.rankings || {};

  if(results.tasks){
    state.tasks = results.tasks;
  } else if(oldChecklist){
    state.tasks = oldChecklist.filter(i => TASK_CATS.includes(i.cat)).map(i => ({...i}));
    if(state.tasks.length === 0){
      state.tasks = DEFAULT_TASKS.map(i => ({id:uid(), text:i.t, cat:i.cat, week:i.week, done:false}));
    }
    await saveHousehold('tasks');
  } else {
    state.tasks = DEFAULT_TASKS.map(i => ({id:uid(), text:i.t, cat:i.cat, week:i.week, done:false}));
    await saveHousehold('tasks');
  }

  if(results.registry){
    state.registry = results.registry;
  } else if(oldChecklist){
    state.registry = oldChecklist.filter(i => !TASK_CATS.includes(i.cat)).map(i => ({...i}));
    if(state.registry.length === 0){
      state.registry = DEFAULT_REGISTRY.map(i => ({id:uid(), text:i.t, cat:i.cat, done:false}));
    }
    await saveHousehold('registry');
  } else {
    state.registry = DEFAULT_REGISTRY.map(i => ({id:uid(), text:i.t, cat:i.cat, done:false}));
    await saveHousehold('registry');
  }

  attachLiveSync();
}

function render(){
  if(state.loading){
    root.innerHTML = `<div class="setup-wrap"><div style="color:var(--sage);font-family:'JetBrains Mono',monospace;font-size:13px;">loading…</div></div>`;
    return;
  }
  if(!state.name || !state.code){
    renderSetup();
    return;
  }
  renderApp();
}

function renderSetup(){
  root.innerHTML = `
  <div class="setup-wrap">
    <div class="setup-card">
      <div class="brand-icon" style="margin-bottom:10px;">${cribIcon(34)}</div>
      <span class="eyebrow">${BRAND}</span>
      <h1>Let's get set up</h1>
      <p class="sub">${BRAND} syncs between you and your partner. Pick a shared household code together (anything — like "MorganBaby25") and each enter it on your own phone to link up. You'll only need to do this once — this device will stay signed in.</p>
      <label>Your name</label>
      <input type="text" id="in-name" placeholder="e.g. Alex" />
      <label>Household code</label>
      <input type="text" id="in-code" placeholder="e.g. MorganBaby25" />
      <button class="btn block" id="btn-join">Join household</button>
      <div class="err" id="setup-err"></div>
    </div>
  </div>`;
  document.getElementById('btn-join').onclick = async () => {
    const name = document.getElementById('in-name').value.trim();
    const codeRaw = document.getElementById('in-code').value.trim();
    if(!name || !codeRaw){
      document.getElementById('setup-err').textContent = 'Enter your name and a household code.';
      return;
    }
    const code = codeRaw.toLowerCase().replace(/\s+/g,'-');
    state.name = name;
    state.code = code;
    personalSet('display-name', name);
    personalSet('household-code', code);
    state.loading = true; render();
    await loadHousehold();
    state.loading = false;
    render();
  };
}

function renderApp(){
  const w = state.info.dueDate ? weeksFromDueDate(state.info.dueDate) : null;

  root.innerHTML = `
    <div class="topbar">
      <h1><span class="brand-icon">${cribIcon(24)}</span>${BRAND}</h1>
      <div class="who-col">
        <div class="who">${state.name} · ${state.code} <button id="switch-btn">switch</button></div>
        <button class="settings-btn" id="settings-btn">⚙ Settings</button>
      </div>
    </div>
    <nav class="tabs">
      <button data-tab="overview" class="${state.tab==='overview'?'active':''}">Home</button>
      <button data-tab="checklist" class="${state.tab==='checklist'?'active':''}">Checklist</button>
      <button data-tab="registry" class="${state.tab==='registry'?'active':''}">Registry</button>
      <button data-tab="names" class="${state.tab==='names'?'active':''}">Names</button>
    </nav>
    <div id="tab-content"></div>
  `;
  document.getElementById('switch-btn').onclick = async () => {
    if(fbDb && state.code){ try{ fbDb.ref(`households/${state.code}`).off(); }catch(e){} }
    personalSet('display-name', '');
    personalSet('household-code', '');
    state.name = null; state.code = null; state.liveAttached = false;
    render();
  };
  document.getElementById('settings-btn').onclick = () => {
    state.tab = 'settings';
    render();
  };
  root.querySelectorAll('nav.tabs button').forEach(b => {
    b.onclick = () => { state.tab = b.dataset.tab; render(); };
  });

  const content = document.getElementById('tab-content');
  if(state.tab === 'overview') content.innerHTML = overviewHTML(w);
  else if(state.tab === 'checklist') content.innerHTML = tasksHTML();
  else if(state.tab === 'registry') content.innerHTML = registryHTML();
  else if(state.tab === 'names') content.innerHTML = namesHTML();
  else if(state.tab === 'settings') content.innerHTML = settingsHTML();

  bindTabEvents();
}

function overviewHTML(w){
  if(!w){
    return `
    <div class="card">
      <span class="eyebrow">Due date</span>
      <h2 style="margin-bottom:14px;">When are you due?</h2>
      <input type="date" id="due-input" />
      <button class="btn" id="due-save" style="margin-top:14px;">Save due date</button>
    </div>`;
  }
  const week = w.week;
  const pct = ((week-4)/(40-4))*100;
  const currentMonthIdx = Math.min(9, Math.max(0, Math.round((week-4)/4)));

  let dots = '';
  for(let i=0; i<=9; i++){
    const wk = 4 + i*4;
    const left = (i/9)*100;
    const tri = trimesterOf(Math.min(wk,40));
    const stateClass = i === currentMonthIdx ? 'current' : (i > currentMonthIdx ? 'future' : '');
    dots += `<div class="vine-dot tri-${tri} ${stateClass}" style="left:${left}%">${i}</div>`;
  }

  const fruitName = FRUITS[week] || 'small pumpkin';
  const fruitArticle = /^[aeiou]/i.test(fruitName) ? 'an' : 'a';
  const fruitLink = `https://www.google.com/search?q=${encodeURIComponent(fruitName + ' dessert recipe')}`;

  const weekItems = state.tasks.filter(i => i.week === week && !i.done);

  return `
  <div class="card">
    <div class="week-hero">
      <div class="week-num">Week ${week}</div>
      <div class="week-meta">
        <div><b>${w.daysLeft}</b> days until your due date</div>
        <div>Due ${w.due.toLocaleDateString(undefined,{month:'long', day:'numeric', year:'numeric'})}</div>
      </div>
    </div>
    <div class="vine">
      <div class="vine-line"></div>
      <div class="vine-fill" style="width:${pct}%"></div>
      ${dots}
    </div>
    <div class="fact">Right now, baby is about the size of ${fruitArticle} <a href="${fruitLink}" target="_blank" rel="noopener" class="fruit-link">${escapeHtml(fruitName)}</a>.</div>
  </div>
  <div class="card">
    <span class="eyebrow">This week's to-dos</span>
    <h2 style="margin-bottom:14px;">Week ${week} checklist</h2>
    ${weekItems.length === 0
      ? `<div class="empty">Nothing scheduled specifically for this week — check the full Checklist tab.</div>`
      : weekItems.map(i => `
        <div class="item-row">
          <input type="checkbox" data-id="${i.id}" class="chk-home" ${i.done?'checked':''}/>
          <div class="txt">${escapeHtml(i.text)}</div>
          <span class="tag">${i.cat}</span>
        </div>`).join('')}
  </div>`;
}

function settingsHTML(){
  return `
  <div class="card">
    <span class="eyebrow">Due date</span>
    <h2 style="margin-bottom:14px;">When are you due?</h2>
    <input type="date" id="due-input" value="${state.info.dueDate || ''}" />
    <button class="btn ghost small" id="due-save" style="margin-top:10px;">Update due date</button>
  </div>
  <div class="card">
    <span class="eyebrow">Household</span>
    <h2 style="margin-bottom:14px;">Parent names</h2>
    <label>Mother's name</label>
    <input type="text" id="mother-name" value="${escapeHtml(state.info.motherName || '')}" placeholder="e.g. Jamie" />
    <label>Father's name</label>
    <input type="text" id="father-name" value="${escapeHtml(state.info.fatherName || '')}" placeholder="e.g. Alex" />
    <button class="btn small" id="parents-save" style="margin-top:14px;">Save names</button>
  </div>`;
}

function tasksHTML(){
  const currentWeek = currentWeekNum();
  const catOptions = ["All", ...TASK_CATS];
  const timeOptions = ["All","Overdue","This week","Upcoming"];

  let items = state.tasks.slice();
  if(state.taskFilterCat !== 'All') items = items.filter(i => i.cat === state.taskFilterCat);
  if(state.taskFilterTime === 'Overdue'){
    items = items.filter(i => !i.done && currentWeek != null && i.week != null && i.week < currentWeek);
  } else if(state.taskFilterTime === 'This week'){
    items = items.filter(i => currentWeek != null && i.week === currentWeek);
  } else if(state.taskFilterTime === 'Upcoming'){
    items = items.filter(i => currentWeek != null && i.week != null && i.week > currentWeek);
  }

  // Sort: overdue (not done, week < currentWeek) first, then by week asc (unscheduled last), then original order.
  items.sort((a,b) => {
    const aOverdue = !a.done && currentWeek != null && a.week != null && a.week < currentWeek;
    const bOverdue = !b.done && currentWeek != null && b.week != null && b.week < currentWeek;
    if(aOverdue !== bOverdue) return aOverdue ? -1 : 1;
    const aw = a.week == null ? 999 : a.week;
    const bw = b.week == null ? 999 : b.week;
    if(aw !== bw) return aw - bw;
    return 0;
  });

  let rows = items.map(i => {
    const overdue = !i.done && currentWeek != null && i.week != null && i.week < currentWeek;
    return `
    <div class="item-row ${i.done?'done':''}">
      <input type="checkbox" data-id="${i.id}" class="chk" ${i.done?'checked':''}/>
      <div class="txt">${escapeHtml(i.text)}</div>
      <div class="item-meta">
        ${overdue ? `<span class="overdue-tag">Overdue</span>` : ''}
        ${i.week != null ? `<span class="week-tag">wk ${i.week}</span>` : ''}
        <span class="tag">${i.cat}</span>
      </div>
      <button class="del" data-id="${i.id}">×</button>
    </div>`;
  }).join('');
  if(items.length === 0) rows = `<div class="empty">No checklist items match this filter.</div>`;

  return `
  <div class="card">
    <span class="eyebrow">Checklist / To-Do</span>
    <h2 style="margin-bottom:14px;">Pregnancy prep tasks</h2>
    <div class="filter-row">
      <select id="task-filter-cat">
        ${catOptions.map(c => `<option value="${c}" ${state.taskFilterCat===c?'selected':''}>${c==='All'?'All categories':c}</option>`).join('')}
      </select>
      <select id="task-filter-time">
        ${timeOptions.map(t => `<option value="${t}" ${state.taskFilterTime===t?'selected':''}>${t==='All'?'All timeframes':t}</option>`).join('')}
      </select>
    </div>
    ${rows}
    <div class="add-row">
      <input type="text" id="new-task" placeholder="Add a to-do…" />
      <input type="number" id="new-task-week" class="week-input" placeholder="Week" min="1" max="42" />
      <select id="new-task-cat">
        ${TASK_CATS.map(c => `<option>${c}</option>`).join('')}
      </select>
      <button class="btn small" id="add-task">Add</button>
    </div>
  </div>`;
}

function registryHTML(){
  const catOptions = ["All", ...REGISTRY_CATS];
  let items = state.registry.slice();
  if(state.registryFilterCat !== 'All') items = items.filter(i => i.cat === state.registryFilterCat);

  let html;
  if(items.length === 0){
    html = `<div class="empty">No registry items match this filter.</div>`;
  } else if(state.registryFilterCat !== 'All'){
    html = items.map(i => itemRowHTML(i)).join('');
  } else {
    html = REGISTRY_CATS.map(cat => {
      const catItems = items.filter(i => i.cat === cat);
      if(catItems.length === 0) return '';
      return `<div class="cat-heading">${cat}</div>` + catItems.map(i => itemRowHTML(i)).join('');
    }).join('');
  }

  function itemRowHTML(i){
    return `
    <div class="item-row ${i.done?'done':''}">
      <input type="checkbox" data-id="${i.id}" class="chk-reg" ${i.done?'checked':''}/>
      <div class="txt">${escapeHtml(i.text)}</div>
      <span class="tag">${i.cat}</span>
      <button class="del-reg" data-id="${i.id}">×</button>
    </div>`;
  }

  return `
  <div class="card">
    <span class="eyebrow">Registry / Equipment</span>
    <h2 style="margin-bottom:14px;">What to buy or borrow</h2>
    <div class="filter-row">
      <select id="reg-filter-cat">
        ${catOptions.map(c => `<option value="${c}" ${state.registryFilterCat===c?'selected':''}>${c==='All'?'All categories':c}</option>`).join('')}
      </select>
    </div>
    ${html}
    <div class="add-row">
      <input type="text" id="new-reg" placeholder="Add a registry item…" />
      <select id="new-reg-cat">
        ${REGISTRY_CATS.map(c => `<option>${c}</option>`).join('')}
      </select>
      <button class="btn small" id="add-reg">Add</button>
    </div>
  </div>`;
}

// ---- Names / ranked-choice ----

function knownUsersFor(gender){
  const set = new Set();
  if(state.name) set.add(state.name);
  (state.names || []).filter(n => n.gender === gender).forEach(n => { if(n.addedBy) set.add(n.addedBy); });
  const rk = state.rankings[gender] || {};
  Object.keys(rk).forEach(u => set.add(u));
  return Array.from(set);
}

function orderFor(gender, user){
  const namesInGender = state.names.filter(n => n.gender === gender).map(n => n.id);
  const saved = (state.rankings[gender] && state.rankings[gender][user]) || [];
  const savedValid = saved.filter(id => namesInGender.includes(id));
  const missing = namesInGender.filter(id => !savedValid.includes(id));
  return [...savedValid, ...missing];
}

function nameById(id){ return state.names.find(n => n.id === id); }

function namesHTML(){
  const gender = state.namesGender;
  const user = state.name;
  const order = orderFor(gender, user);
  const users = knownUsersFor(gender);

  let myList;
  if(order.length === 0){
    myList = `<div class="empty">No ${gender.toLowerCase()} names yet — add your first idea below.</div>`;
  } else {
    myList = order.map((id, idx) => {
      const n = nameById(id);
      if(!n) return '';
      return `
      <div class="name-card">
        <div class="name-left">
          <div class="nm">${escapeHtml(n.name)}</div>
          <div class="meta">added by ${escapeHtml(n.addedBy)}</div>
        </div>
        <div class="rank-controls">
          <button class="rank-up" data-id="${id}" ${idx===0?'disabled':''}>▲</button>
          <span class="rank-num">${idx+1}</span>
          <button class="rank-down" data-id="${id}" ${idx===order.length-1?'disabled':''}>▼</button>
        </div>
        <button class="del-name" data-id="${id}">×</button>
      </div>`;
    }).join('');
  }

  const top10Cols = users.map(u => {
    const uOrder = orderFor(gender, u).slice(0, 10);
    const items = uOrder.map(id => {
      const n = nameById(id);
      return n ? `<li>${escapeHtml(n.name)}</li>` : '';
    }).join('');
    return `
    <div class="top10-col">
      <h4>${escapeHtml(u)}'s top ${uOrder.length || 0}</h4>
      ${uOrder.length ? `<ol>${items}</ol>` : `<div class="empty">No ranked names yet.</div>`}
    </div>`;
  }).join('');

  return `
  <div class="card">
    <span class="eyebrow">Name ideas</span>
    <h2 style="margin-bottom:14px;">Rank your favorites</h2>
    <div class="subtab-row">
      ${NAME_GENDERS.map(g => `<button data-gender="${g}" class="${gender===g?'active':''}">${g}</button>`).join('')}
    </div>
    <div style="font-size:13px;color:var(--sage);margin-bottom:10px;">Use ▲ ▼ to rank in order of preference — #1 is your favorite.</div>
    ${myList}
    <div class="add-row">
      <input type="text" id="n-name" placeholder="Name idea…" />
      <button class="btn small" id="n-add">Add</button>
    </div>
  </div>
  <div class="card">
    <span class="eyebrow">Compare</span>
    <h2 style="margin-bottom:10px;">Each parent's top 10 — ${gender}</h2>
    <div class="top10-grid">${top10Cols}</div>
  </div>`;
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function bindTabEvents(){
  // Overview / Settings — due date
  const dueSave = document.getElementById('due-save');
  if(dueSave){
    dueSave.onclick = async () => {
      const v = document.getElementById('due-input').value;
      if(!v) return;
      state.info.dueDate = v;
      await saveHousehold('info');
      render();
    };
  }
  root.querySelectorAll('.chk-home').forEach(cb => {
    cb.onchange = async () => {
      const item = state.tasks.find(i=>i.id===cb.dataset.id);
      item.done = cb.checked;
      await saveHousehold('tasks');
      render();
    };
  });

  // Settings — parent names
  const parentsSave = document.getElementById('parents-save');
  if(parentsSave){
    parentsSave.onclick = async () => {
      state.info.motherName = document.getElementById('mother-name').value.trim();
      state.info.fatherName = document.getElementById('father-name').value.trim();
      await saveHousehold('info');
      render();
    };
  }

  // Checklist (tasks)
  const catFilter = document.getElementById('task-filter-cat');
  if(catFilter){
    catFilter.onchange = () => { state.taskFilterCat = catFilter.value; render(); };
  }
  const timeFilter = document.getElementById('task-filter-time');
  if(timeFilter){
    timeFilter.onchange = () => { state.taskFilterTime = timeFilter.value; render(); };
  }
  root.querySelectorAll('.chk').forEach(cb => {
    cb.onchange = async () => {
      const item = state.tasks.find(i=>i.id===cb.dataset.id);
      item.done = cb.checked;
      await saveHousehold('tasks');
      render();
    };
  });
  const addTaskBtn = document.getElementById('add-task');
  if(addTaskBtn){
    addTaskBtn.onclick = async () => {
      const inp = document.getElementById('new-task');
      const weekInp = document.getElementById('new-task-week');
      const cat = document.getElementById('new-task-cat').value;
      if(!inp.value.trim()) return;
      const week = weekInp.value ? Number(weekInp.value) : null;
      state.tasks.push({id:uid(), text:inp.value.trim(), cat, week, done:false});
      await saveHousehold('tasks');
      render();
    };
  }
  root.querySelectorAll('.item-row .del').forEach(btn => {
    btn.onclick = async () => {
      state.tasks = state.tasks.filter(i=>i.id!==btn.dataset.id);
      await saveHousehold('tasks');
      render();
    };
  });

  // Registry
  const regFilter = document.getElementById('reg-filter-cat');
  if(regFilter){
    regFilter.onchange = () => { state.registryFilterCat = regFilter.value; render(); };
  }
  root.querySelectorAll('.chk-reg').forEach(cb => {
    cb.onchange = async () => {
      const item = state.registry.find(i=>i.id===cb.dataset.id);
      item.done = cb.checked;
      await saveHousehold('registry');
      render();
    };
  });
  const addRegBtn = document.getElementById('add-reg');
  if(addRegBtn){
    addRegBtn.onclick = async () => {
      const inp = document.getElementById('new-reg');
      const cat = document.getElementById('new-reg-cat').value;
      if(!inp.value.trim()) return;
      state.registry.push({id:uid(), text:inp.value.trim(), cat, done:false});
      await saveHousehold('registry');
      render();
    };
  }
  root.querySelectorAll('.del-reg').forEach(btn => {
    btn.onclick = async () => {
      state.registry = state.registry.filter(i=>i.id!==btn.dataset.id);
      await saveHousehold('registry');
      render();
    };
  });

  // Names
  root.querySelectorAll('.subtab-row button').forEach(btn => {
    btn.onclick = () => { state.namesGender = btn.dataset.gender; render(); };
  });
  const nAdd = document.getElementById('n-add');
  if(nAdd){
    nAdd.onclick = async () => {
      const name = document.getElementById('n-name').value.trim();
      if(!name) return;
      const gender = state.namesGender;
      const id = uid();
      state.names.push({id, name, gender, addedBy: state.name});
      await saveHousehold('names');
      // Append to the current user's ranking at the end.
      if(!state.rankings[gender]) state.rankings[gender] = {};
      const order = orderFor(gender, state.name).filter(x => x !== id);
      order.push(id);
      state.rankings[gender][state.name] = order;
      await saveHousehold('rankings');
      render();
    };
  }
  root.querySelectorAll('.del-name').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      state.names = state.names.filter(n=>n.id!==id);
      Object.keys(state.rankings).forEach(g => {
        Object.keys(state.rankings[g]).forEach(u => {
          state.rankings[g][u] = state.rankings[g][u].filter(x=>x!==id);
        });
      });
      await saveHousehold('names');
      await saveHousehold('rankings');
      render();
    };
  });
  root.querySelectorAll('.rank-up, .rank-down').forEach(btn => {
    btn.onclick = async () => {
      const gender = state.namesGender;
      const user = state.name;
      const order = orderFor(gender, user);
      const id = btn.dataset.id;
      const idx = order.indexOf(id);
      const dir = btn.classList.contains('rank-up') ? -1 : 1;
      const swapIdx = idx + dir;
      if(swapIdx < 0 || swapIdx >= order.length) return;
      [order[idx], order[swapIdx]] = [order[swapIdx], order[idx]];
      if(!state.rankings[gender]) state.rankings[gender] = {};
      state.rankings[gender][user] = order;
      await saveHousehold('rankings');
      render();
    };
  });
}

(async function init(){
  render();
  await loadPersonal();
  if(state.name && state.code){
    await loadHousehold();
  }
  state.loading = false;
  render();
})();
</script>
